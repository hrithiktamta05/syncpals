<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SyncPals - Direct P2P Watch Party & Chat</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b0f19; color: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column; }
    
    header { background: #111827; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2937; }
    .brand { font-size: 20px; font-weight: 800; color: #38bdf8; letter-spacing: 0.5px; }
    .status-badge { font-size: 12px; padding: 5px 12px; border-radius: 9999px; font-weight: 600; text-transform: uppercase; }
    .status-online { background: #166534; color: #4ade80; }
    .status-waiting { background: #854d0e; color: #fde047; }

    /* Top Display Banner Ad Container */
    .ad-top-wrapper { width: 100%; display: flex; justify-content: center; padding: 12px 0; background: #070a12; border-bottom: 1px solid #1f2937; }
    .ad-slot-horizontal { width: 728px; max-width: 95%; height: 90px; background: #111827; border: 1px dashed #374151; display: flex; align-items: center; justify-content: center; color: #6b7280; font-size: 12px; letter-spacing: 1px; }

    /* Main Section */
    .main-grid { display: grid; grid-template-columns: 1fr 340px; gap: 16px; padding: 16px; flex: 1; max-width: 1400px; margin: 0 auto; width: 100%; }

    /* Video Player & Controls */
    .video-column { display: flex; flex-direction: column; gap: 12px; }
    .video-frame { background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; border: 1px solid #1f2937; }
    video { width: 100%; height: 100%; object-fit: contain; }

    .control-panel { background: #111827; padding: 12px 16px; border-radius: 8px; display: flex; gap: 10px; align-items: center; border: 1px solid #1f2937; flex-wrap: wrap; }
    .control-panel input { flex: 1; min-width: 200px; background: #0b0f19; border: 1px solid #374151; padding: 10px 14px; border-radius: 6px; color: #f1f5f9; font-size: 13px; outline: none; }
    .btn { background: #0284c7; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; transition: 0.2s; }
    .btn:hover { background: #0369a1; }
    .btn-secondary { background: #1f2937; }
    .btn-secondary:hover { background: #374151; }
    .btn-danger { background: #dc2626; }
    .btn-danger:hover { background: #b91c1c; }

    /* Chat and Sidebar Ad */
    .sidebar-column { display: flex; flex-direction: column; gap: 12px; height: calc(100vh - 190px); }
    .chat-card { flex: 1; background: #111827; border-radius: 8px; border: 1px solid #1f2937; display: flex; flex-direction: column; overflow: hidden; min-height: 250px; }
    .chat-body { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 13px; word-break: break-word; }
    .msg.me { align-self: flex-end; background: #0284c7; color: #fff; }
    .msg.peer { align-self: flex-start; background: #1f2937; color: #e2e8f0; }
    .msg.system { align-self: center; background: transparent; color: #94a3b8; font-size: 11px; }

    .chat-input-bar { padding: 10px; background: #0b0f19; display: flex; gap: 8px; border-top: 1px solid #1f2937; }
    .chat-input-bar input { flex: 1; background: #111827; border: 1px solid #374151; padding: 8px 12px; border-radius: 6px; color: #fff; font-size: 13px; outline: none; }

    .ad-slot-sidebar { width: 100%; height: 250px; background: #111827; border: 1px dashed #374151; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #6b7280; font-size: 12px; letter-spacing: 1px; }

    @media (max-width: 900px) {
      .main-grid { grid-template-columns: 1fr; }
      .sidebar-column { height: auto; }
      .chat-card { height: 350px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">SyncPals</div>
    <div id="conn-status" class="status-badge status-waiting">Initializing Room...</div>
  </header>

  <!-- Top 728x90 Ad Container -->
  <div class="ad-top-wrapper">
    <div class="ad-slot-horizontal" id="top-ad-slot">
      Top Ad Slot (728x90 Banner)
    </div>
  </div>

  <div class="main-grid">
    <div class="video-column">
      <div class="video-frame">
        <video id="remote-video" autoplay playsinline controls></video>
      </div>

      <div class="control-panel">
        <input type="text" id="room-link" readonly placeholder="Generating shareable invite link...">
        <button class="btn btn-secondary" id="copy-btn">Copy Link</button>
        <button class="btn" id="share-btn">Share Video / Tab</button>
        <button class="btn btn-danger" id="stop-btn" style="display: none;">Stop Share</button>
      </div>
    </div>

    <div class="sidebar-column">
      <div class="chat-card">
        <div class="chat-body" id="chat-messages">
          <div class="msg system">Dost ko link bhejo aur connect hone par chat shuru karo.</div>
        </div>
        <form class="chat-input-bar" id="chat-form">
          <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off">
          <button type="submit" class="btn">Send</button>
        </form>
      </div>

      <!-- Sticky 300x250 Ad Container -->
      <div class="ad-slot-sidebar" id="sidebar-ad-slot">
        Sidebar Ad Slot (300x250 Rectangle)
      </div>
    </div>
  </div>

  <script>
    // Config: Apna Render server host yahan badlein
    // Default testing ke liye agar null chhodte hain to PeerJS cloud chalega
    const SIGNALING_CONFIG = {
      host: 'syncpals-signaling.onrender.com', // Deploy karne ke baad un-comment karein
      port: 443,
      path: '/syncpals',
      secure: true,
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      }
    };

    let peer = null;
    let dataConn = null;
    let mediaCall = null;
    let localStream = null;

    const statusBadge = document.getElementById('conn-status');
    const roomLinkInput = document.getElementById('room-link');
    const copyBtn = document.getElementById('copy-btn');
    const shareBtn = document.getElementById('share-btn');
    const stopBtn = document.getElementById('stop-btn');
    const remoteVideo = document.getElementById('remote-video');
    const chatMessages = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');

    const urlParams = new URLSearchParams(window.location.search);
    const existingRoom = urlParams.get('room');

    // PeerJS instance initiate
    peer = new Peer(SIGNALING_CONFIG);

    peer.on('open', (id) => {
      if (existingRoom) {
        // Guest mode
        statusBadge.innerText = 'Connecting to Host...';
        statusBadge.className = 'status-badge status-waiting';
        roomLinkInput.value = window.location.href;

        dataConn = peer.connect(existingRoom);
        bindDataEvents();
      } else {
        // Host mode
        const roomUrl = `${window.location.origin}${window.location.pathname}?room=${id}`;
        roomLinkInput.value = roomUrl;
        statusBadge.innerText = 'Waiting for Friend...';
        statusBadge.className = 'status-badge status-waiting';
      }
    });

    peer.on('connection', (conn) => {
      dataConn = conn;
      bindDataEvents();
    });

    peer.on('call', (call) => {
      mediaCall = call;
      call.answer();
      call.on('stream', (incomingStream) => {
        remoteVideo.srcObject = incomingStream;
      });
    });

    function bindDataEvents() {
      dataConn.on('open', () => {
        statusBadge.innerText = 'Connected';
        statusBadge.className = 'status-badge status-online';
        appendMessage('Connected directly to peer!', 'system');
      });

      dataConn.on('data', (data) => {
        appendMessage(data, 'peer');
      });

      dataConn.on('close', () => {
        statusBadge.innerText = 'Disconnected';
        statusBadge.className = 'status-badge status-waiting';
        appendMessage('Friend disconnected.', 'system');
      });
    }

    // Video Sharing (Local Screen, App, Tab with Audio)
    shareBtn.addEventListener('click', async () => {
      const targetId = existingRoom || (dataConn ? dataConn.peer : null);
      if (!targetId || !dataConn || !dataConn.open) {
        alert('Pehle samne wale ko link share karke connect hone dein.');
        return;
      }

      try {
        localStream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: { ideal: 30 } },
          audio: true
        });

        remoteVideo.srcObject = localStream;
        shareBtn.style.display = 'none';
        stopBtn.style.display = 'inline-block';

        mediaCall = peer.call(targetId, localStream);

        localStream.getVideoTracks()[0].onended = () => {
          stopSharing();
        };
      } catch (err) {
        console.error('Sharing cancelled:', err);
      }
    });

    stopBtn.addEventListener('click', stopSharing);

    function stopSharing() {
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      if (mediaCall) {
        mediaCall.close();
      }
      remoteVideo.srcObject = null;
      shareBtn.style.display = 'inline-block';
      stopBtn.style.display = 'none';
    }

    // Chat handling
    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = chatInput.value.trim();
      if (!text) return;

      if (dataConn && dataConn.open) {
        dataConn.send(text);
        appendMessage(text, 'me');
        chatInput.value = '';
      } else {
        alert('Connection chalu nahi hai!');
      }
    });

    function appendMessage(text, type) {
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.innerText = text;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    copyBtn.addEventListener('click', () => {
      if (!roomLinkInput.value) return;
      navigator.clipboard.writeText(roomLinkInput.value);
      copyBtn.innerText = 'Copied!';
      setTimeout(() => { copyBtn.innerText = 'Copy Link'; }, 2000);
    });
  </script>
</body>
</html>
